name: Tick (every 10 min, runs whatever is due)

on:
  schedule:
    - cron: '*/10 * * * *' # fallback only; cron-job.org is the real trigger
  workflow_dispatch:

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tick.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
