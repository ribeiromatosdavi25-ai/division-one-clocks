name: Open the server (one-off, 2026-10-08)

on:
  push:
    branches: [open-server]

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node open-server.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DRY_RUN: '0'
